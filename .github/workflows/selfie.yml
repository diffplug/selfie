name: Selfie
on:
  push:
    branches: ["**"]
jobs:
  selfie:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # What a commit reaches is what its approvals come from, so this needs all of its history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install --global pnpm@10.30.1 && pnpm install --frozen-lockfile
      - uses: ./.github/actions/selfie
        with:
          upload-token: ${{ secrets.SELFIE_UPLOAD_TOKEN }}
