<template>
  <style>
    #root { position: absolute; inset: 0; }
    #ripple-stage { background: var(--sky); }
  </style>
  <div data-hf-id="hf-dxld" id="root" data-composition-id="ripple" data-width="1920" data-height="1080">
    <div data-hf-id="hf-9soe" id="ripple-stage" class="stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const { tl, at, stage } = S.begin("ripple", 5);
      const w = (word, o) => S.say("ripple", word, o);
      const zoom = S.html(stage, `<div class="abs" style="width:1920px;height:1080px;transform-origin:0 0"></div>`);
      const frame = S.storybookFrame(zoom);
      gsap.set(frame.items[3], { backgroundColor: S.SUN });
      const cam = S.html(zoom, `<div class="abs" style="width:1920px;height:1080px;transform-origin:0 0"></div>`);
      gsap.set(cam, S.FRAMED);
      const cards = S.grid(cam);
      S.rowLabels(cam);
      const fog = S.html(stage, `<div class="abs" style="width:1920px;height:1080px;background:var(--fog);opacity:0"></div>`);

      const target = S.framedCell(3, 2);
      const r = S.robot(zoom, { id: "ripple-robot", prop: "hammer", scale: 1.1 });
      gsap.set(r.el, { x: target.x - S.HAMMER.x * 1.1, y: target.y - S.HAMMER.y * 1.1 });
      gsap.set(r.armR, { rotation: -60 });

      // The hammer's last strike, and the ripple it sends through every story.
      const hit = w("ripples");
      S.swing(tl, r.armR, w("understand"), { rest: -60 });
      S.ringAt(tl, zoom, target.x, target.y, w("understand"), { size: 260, color: S.ORANGE, dur: 0.35 });
      S.swing(tl, r.armR, hit, { rest: -60 });
      [0, 0.12, 0.26].forEach((d) => S.ringAt(tl, zoom, target.x, target.y, hit + d, { size: 2600, dur: 1.2 }));
      const dist = (c, row) => Math.hypot(c - 3, row - 2);
      cards.forEach((col, c) => col.forEach((el, row) => {
        const t = hit + dist(c, row) * 0.09, p = S.gridPos(c, row);
        tl.to(el, { y: p.y - 26, duration: 0.14, ease: "power2.out" }, t);
        tl.to(el, { y: p.y, duration: 0.34, ease: "bounce.out" }, t + 0.14);
      }));

      // Stories far from the hammer come back wrong, behind the robot's back.
      [[0, 4, -7], [5, 0, 6], [0, 0, 5], [5, 4, -5], [1, 1, 6]].forEach(([c, row, rot]) => {
        const t = hit + dist(c, row) * 0.09 + 0.15, el = cards[c][row];
        tl.to(el, { rotation: rot, duration: 0.3, ease: "back.out(3)" }, t);
        tl.to(el.querySelector(".crack"), { opacity: 1, duration: 0.03 }, t);
        tl.to(el.querySelector(".flag"), { opacity: 1, duration: 0.03 }, t);
      });
      tl.to(r.head, { rotation: -14, duration: 0.25, ease: "power2.inOut" }, w("code") - 0.2);
      S.gasp(tl, r, w("code") + 0.05);

      // Into the broken story the question points at, and out into the next world.
      const c = S.framedCell(0, 4);
      tl.to(zoom, { x: 960 - c.x * 6, y: 540 - c.y * 6, scale: 6, duration: 0.65, ease: "power3.in" }, at(5) - 0.68);
      tl.to(fog, { opacity: 1, duration: 0.26, ease: "power2.in" }, at(5) - 0.28);
      window.__timelines["ripple"] = tl;
    })();
  </script>
</template>
