<template>
  <style>
    #root { position: absolute; inset: 0; }
    #states-stage { background: var(--sky); }
  </style>
  <div data-hf-id="hf-qgmh" id="root" data-composition-id="states" data-width="1920" data-height="1080">
    <div data-hf-id="hf-peaq" id="states-stage" class="stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const { tl, at, stage } = S.begin("states", 8.2);
      const cam = S.html(stage, `<div class="abs" style="width:1920px;height:1080px;transform-origin:0 0"></div>`);
      const cards = S.grid(cam);
      const labels = S.rowLabels(cam);
      gsap.set(labels, { opacity: 0 });

      // Everything but the top row starts hidden behind it, and the top row starts where the last scene left it.
      cards.forEach((col, c) => {
        S.place(col[0], S.rowPos(c));
        col.slice(1).forEach((el) => { S.place(el, S.gridPos(c, 0)); gsap.set(el, { opacity: 0 }); });
      });

      const Z = 1.7, FOCUS = 1;
      const camAt = (r) => ({ x: 960 - Z * (S.gridPos(FOCUS, r).x + 122), y: 440 - Z * (S.gridPos(FOCUS, r).y + 95), scale: Z });

      // Zoom in on one component.
      cards.forEach((col, c) => {
        const p = S.gridPos(c, 0);
        tl.to(col[0], { x: p.x, y: p.y, scale: 1, duration: 0.8, ease: "power3.inOut" }, at(0.2));
      });
      tl.to(cam, { ...camAt(0), duration: 1.1, ease: "power2.inOut" }, at(0.5));
      tl.to(labels[0], { opacity: 1, duration: 0.2 }, at(1.5));

      // It splits down the column as each state is named: error, empty, easy, hard.
      const col = cards[FOCUS];
      [[2, 3.0], [1, 4.05], [3, 5.7]].forEach(([r, t]) => {
        tl.set(col[r], { opacity: 1 }, at(t));
        tl.to(col[r], { y: S.gridPos(FOCUS, r).y, duration: 0.55, ease: "back.out(1.5)" }, at(t));
        tl.to(cam, { ...camAt(r), duration: 0.6, ease: "power2.inOut" }, at(t) - 0.05);
        tl.to(labels[r], { opacity: 1, duration: 0.2 }, at(t) + 0.2);
      });
      tl.to(cam, { ...camAt(0), duration: 0.5, ease: "power2.inOut" }, at(4.95));
      tl.to(col[0], { scale: 1.06, duration: 0.14, ease: "power2.out" }, at(5.05));
      tl.to(col[0], { scale: 1, duration: 0.3, ease: "power2.out" }, at(5.05) + 0.14);

      // Zoom out as every other column does the same.
      tl.to(cam, { x: 0, y: 0, scale: 1, duration: 0.8, ease: "power2.inOut" }, at(6.5));
      cards.forEach((c0, c) => {
        if (c === FOCUS) return;
        c0.slice(1).forEach((el, i) => {
          const t = at(6.65) + (Math.abs(c - FOCUS) - 1) * 0.1 + i * 0.05;
          tl.set(el, { opacity: 1 }, t);
          tl.to(el, { y: S.gridPos(c, i + 1).y, duration: 0.5, ease: "back.out(1.3)" }, t);
        });
      });
      window.__timelines["states"] = tl;
    })();
  </script>
</template>
