<template>
  <style>
    #root { position: absolute; inset: 0; }
    #split-stage { background: var(--sky); }
  </style>
  <div data-hf-id="hf-1lbp" id="root" data-composition-id="split" data-width="1920" data-height="1080">
    <div data-hf-id="hf-6tqe" id="split-stage" class="stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const { tl, at, stage } = S.begin("split", 6.8);
      const win = S.appWindow(stage, "split-window");
      const cards = S.KIND_ORDER.map((k, i) => { const c = S.card(stage, k); S.place(c, S.appPos(i)); return c; });

      // Picks up where the cold open left off: damage, and a startled robot.
      S.DAMAGED.forEach(([i, rot]) => {
        gsap.set(cards[i], { rotation: rot, y: S.appPos(i).y + 18 });
        const crack = cards[i].querySelector(".crack"), flag = cards[i].querySelector(".flag");
        gsap.set([crack, flag], { opacity: 1 });
        tl.to(cards[i], { rotation: 0, y: S.appPos(i).y, duration: 0.45, ease: "back.out(1.8)" }, at(0.25));
        tl.to([crack, flag], { opacity: 0, duration: 0.25 }, at(0.25));
      });
      const r = S.robot(stage, { id: "split-robot", prop: "hammer", scale: S.COLD_ROBOT.scale });
      gsap.set(r.el, { x: S.COLD_ROBOT.x, y: S.COLD_ROBOT.y });
      gsap.set(r.armR, { rotation: -60 }); gsap.set(r.head, { rotation: 16 }); gsap.set(r.smile, { opacity: 0 }); gsap.set(r.o, { opacity: 1 });
      tl.to(r.el, { y: -700, duration: 0.42, ease: "power3.in" }, at(0.1));

      // The window lifts off, and the pieces take their places one by one.
      tl.to(win, { y: -950, duration: 0.55, ease: "power3.in" }, at(1.0));
      S.KIND_ORDER.forEach((k, c) => {
        const p = S.rowPos(c), t = at(1.2 + c * 0.5);
        tl.to(cards[c], { x: p.x, scale: p.scale, duration: 0.85, ease: "power3.inOut" }, t);
        tl.to(cards[c], { y: p.y, duration: 0.85, ease: "back.inOut(1.2)" }, t);
      });

      // The finished row answers with one wave.
      S.KIND_ORDER.forEach((k, c) => {
        tl.to(cards[c], { y: S.rowPos(c).y - 26, duration: 0.16, ease: "power2.out" }, at(5.2 + c * 0.09));
        tl.to(cards[c], { y: S.rowPos(c).y, duration: 0.3, ease: "bounce.out" }, at(5.2 + c * 0.09) + 0.16);
      });
      window.__timelines["split"] = tl;
    })();
  </script>
</template>
