<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="verify" data-width="1920" data-height="1080">
    <div id="verify-stage" class="stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const { tl, w, stage } = S.begin("verify");
      const a = S.app(stage, ["h2-replied"], { pointer: [1000, 700] });
      S.slideIn(tl, a.win);
      // The real images. White is what the note was on, and dark is the batch the agent answered from.
      const before = S.html(a.win, `<img class="abs" src="assets/ui/dark-before.png" alt="" style="width:1600px;height:1200px;opacity:0" data-layout-ignore />`);
      const after = S.html(a.win, `<img class="abs" src="assets/ui/dark-after.png" alt="" style="width:1600px;height:1200px;opacity:0" data-layout-ignore />`);
      const back = w("85000") - 0.05;
      tl.set(before, { opacity: 1 }, 0.05);
      tl.set(after, { opacity: 1 }, w("dark"));
      tl.set([before, after], { opacity: 0 }, back);
      a.zoomNow({ x: 320, y: 255, w: 800 });
      S.call(tl, stage, "85,143 → 13", 1310, 60, w("85000") + 0.1);
      window.__timelines["verify"] = tl;
    })();
  </script>
</template>
