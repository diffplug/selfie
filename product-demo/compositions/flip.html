<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="flip" data-width="1920" data-height="1080">
    <div id="flip-stage" class="stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const { tl, w, stage, D } = S.begin("flip");
      const a = S.app(stage, ["a2-layout", "b1-layout-story", "b2-stacked-a", "b3-stacked-b"], { pointer: [414, 462] });
      a.zoomNow({ x: 320, y: 420, w: 1270 });
      a.point(tl, 0.05, "b1-layout-story", 0.45);
      a.zoom(tl, 0.05, null, 0.45);
      a.press(tl, 0.5);
      a.show(tl, "b1-layout-story", 0.53);
      // Yellow is the spacing, on the diff, in its three rows of hunks.
      a.zoom(tl, w("yellow") - 0.5, { x: 320, y: 590, w: 1270 }, 0.6);
      a.show(tl, "b2-stacked-a", w("press") + 0.2);
      a.zoom(tl, w("press") + 0.2, { x: 320, y: 520, w: 1100 }, 0.5);
      S.call(tl, stage, "F", 1560, 70, w("f") - 0.05, { until: D - 0.2, style: "font-family:'JetBrains Mono',monospace;background:#fff" });
      const flips = [w("flip") + 0.05, w("in") + 0.35, w("see") , w("exactly") + 0.2, w("moved")];
      flips.forEach((t, i) => a.show(tl, i % 2 ? "b2-stacked-a" : "b3-stacked-b", t));
      window.__timelines["flip"] = tl;
    })();
  </script>
</template>
