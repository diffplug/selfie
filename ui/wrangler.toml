# app.selfie.dev. See docs/specs/cloud.md, and OPERATIONS.md for deploying it.
name = "selfie-app"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# Only its own custom domains: any other name for it answers 421 (docs/specs/cloud.md -> Origins).
workers_dev = false
preview_urls = false
routes = [
  { pattern = "app.selfie.dev", custom_domain = true },
  # Built Storybooks are a branch's own code, so they're on another site altogether.
  { pattern = "selfieusercontent.com", custom_domain = true },
  # Where the hackathon's service was, which redirects here.
  { pattern = "hackathon.selfie.dev", custom_domain = true },
]

# Keeps what the Worker logs, which is each error under the code the person saw, and not a line for every request.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[vars]
APP_ORIGIN = "https://app.selfie.dev"
STORYBOOK_ORIGIN = "https://selfieusercontent.com"
FORMER_ORIGINS = "https://hackathon.selfie.dev"

# Sign-in's Postgres, with query caching off, since a sign-out must be seen at once. The release
# workflow overrides this placeholder with the `HYPERDRIVE_ID` variable (OPERATIONS.md).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"

# How often one address may ask the model anything, since anyone may. See docs/specs/chat.md.
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Named for the hackathon, and R2 can't rename a bucket.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "selfie-hackathon-images"

[[d1_databases]]
binding = "DB_1442175397"
database_name = "selfie-project-1442175397"
database_id = "89537c43-e95e-44d6-b2ec-b35b489d82b9"

